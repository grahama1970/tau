name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: uv run pytest -q
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Tau shells out to these binaries; without them the corresponding code
      # paths degrade silently (graph_artifacts._render_graphviz returns None)
      # or raise ToolInputError, so their tests fail instead of proving the real
      # path. fd-find installs as `fdfind`, which tools.py already accepts.
      - name: Install external tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep fd-find graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run pytest suite
        run: uv run pytest -q
